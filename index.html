const pill = (bg, dot, label) => `<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-full shadow-sm ${bg}"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${label}</span>`;
function badgeHTML(t) {
  if (isBroken(t)) return pill('bg-slate-200 text-slate-700', 'bg-slate-500', 'Out for repair');
  const held = heldFor(t);
  if (held) {
    const booked = activeRes(t) && sameName(activeRes(t).name, held);
    return pill('bg-violet-100 text-violet-700', 'bg-violet-500',
      `${booked ? 'Reserved' : 'Held'} for ${isMe(held) ? 'you' : esc(firstName(held))}`);
  }
  if (t.status === 'Available') return pill('bg-emerald-100 text-emerald-700', 'bg-emerald-500', 'Available');
  if (isOverdue(t)) return pill('bg-red-100 text-red-700', 'bg-red-500', 'Overdue');
  return pill('bg-amber-100 text-amber-700', 'bg-amber-500', 'Checked Out');
}

function cardHTML(t) {
  const avail = t.status === 'Available';
  const overdue = isOverdue(t);
  const held = heldFor(t);
  const link = (cls, icon, label) => `<span class="${cls} font-medium inline-flex items-center gap-1"><i data-lucide="${icon}" class="w-4 h-4"></i>${label}</span>`;
  const footer = isBroken(t) ? link('text-slate-500', 'wrench', 'Out for repair')
    : held && !isMe(held) ? (activeRes(t) ? link('text-violet-700', 'calendar-days', 'Booked today') : link('text-violet-700', 'users', 'Join the line'))
    : avail ? `<span class="text-emerald-700 font-medium inline-flex items-center gap-1">${held ? 'Your turn' : 'Borrow'} <i data-lucide="arrow-right" class="w-4 h-4"></i></span>`
    : `<span class="inline-flex items-center gap-1.5 text-slate-600 min-w-0"><i data-lucide="user" class="w-4 h-4 shrink-0"></i><span class="truncate">${isMe(t.borrower) ? 'You' : esc(t.borrower)}</span></span>
       <span class="shrink-0 ${overdue ? 'text-red-600 font-medium' : 'text-slate-500'}">${t.due ? fmtDate(t.due) : ''}</span>`;
  const upcoming = t.reservations.filter(r => r.start > todayISO()).length;
  return `
    <button data-id="${t.id}" class="card-enter ${t.id === flashId ? 'flash' : ''} group text-left bg-white rounded-2xl border ${overdue ? 'border-red-200' : 'border-slate-200'} overflow-hidden hover:shadow-md hover:-translate-y-0.5 transition focus:outline-none focus:ring-2 focus:ring-emerald-500 flex flex-col">
      <div class="relative aspect-square w-full overflow-hidden ${avail && !isBroken(t) ? '' : 'grayscale-[40%]'}">
        ${photoHTML(t)}
        <div class="absolute top-2 left-2">${badgeHTML(t)}</div>
        ${t.condition === 'Needs attention' ? `<div class="absolute bottom-2 left-2 inline-flex items-center gap-1 text-xs font-medium bg-amber-100/95 text-amber-800 px-2 py-1 rounded-full shadow-sm"><i data-lucide="wrench" class="w-3.5 h-3.5"></i>Needs attention</div>` : ''}
        <div class="absolute bottom-2 right-2 flex gap-1">
          ${upcoming ? `<span class="inline-flex items-center gap-1 text-xs font-medium bg-white/90 text-slate-700 px-2 py-1 rounded-full shadow-sm" title="Upcoming bookings"><i data-lucide="calendar-days" class="w-3.5 h-3.5"></i>${upcoming}</span>` : ''}
          ${t.waitlist.length ? `<span class="inline-flex items-center gap-1 text-xs font-medium bg-white/90 text-slate-700 px-2 py-1 rounded-full shadow-sm"><i data-lucide="users" class="w-3.5 h-3.5"></i>${t.waitlist.length} waiting</span>` : ''}
        </div>
      </div>
      <div class="p-3 sm:p-4 flex-1 flex flex-col">
        <div class="font-semibold leading-snug truncate">${esc(t.name)}</div>
        <div class="text-xs sm:text-sm text-slate-500 truncate">${esc(t.category)}${t.owner ? ' · ' + (isMe(t.owner) ? 'yours' : esc(firstName(t.owner)) + "'s") : ''}</div>
        <div class="mt-auto pt-3"><div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2 text-xs sm:text-sm">${footer}</div></div>
      </div>
    </button>`;
}

function renderRequests() {
  const week = addDays(-7);
  const list = requests
    .filter(r => r.status === 'open' || (r.status === 'fulfilled' && r.fulfilledOn >= week))
    .sort((a, b) => (a.status === b.status ? b.date.localeCompare(a.date) : a.status === 'open' ? -1 : 1));
  const btn = 'text-sm font-medium py-2 rounded-lg inline-flex items-center justify-center gap-1.5';
  $('requests').innerHTML = `
    <div class="flex items-end justify-between gap-3 mb-3">
      <div>
        <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i>Wish list</h2>
        <p class="text-sm text-slate-500">Neighbors are looking for these. Got one gathering dust? List it.</p>
      </div>
      <button data-action="ask" class="shrink-0 inline-flex items-center gap-1.5 bg-white border border-slate-200 hover:border-slate-400 text-sm font-medium px-3 py-2 rounded-lg">
        <i data-lucide="message-square-plus" class="w-4 h-4"></i><span class="hidden sm:inline">Ask for a tool</span><span class="sm:hidden">Ask</span>
      </button>
    </div>
    <div class="flex gap-3 overflow-x-auto pb-2 -mx-4 px-4 snap-x">
      ${list.map(r => `
        <div class="snap-start shrink-0 w-64 bg-white rounded-2xl border ${r.status === 'fulfilled' ? 'border-emerald-200' : 'border-slate-200'} p-4 flex flex-col gap-3">
          <div class="flex items-start justify-between gap-2">
            <div class="font-semibold">${esc(r.tool)}</div>
            ${r.status === 'fulfilled' ? '<span class="shrink-0 text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">Found!</span>' : ''}
          </div>
          ${r.note ? `<div class="text-sm text-slate-600">“${esc(r.note)}”</div>` : ''}
          <div class="flex items-center gap-2 text-xs text-slate-500 mt-auto">${avatar(r.by, 'w-5 h-5 text-[9px]')}${isMe(r.by) ? 'You' : esc(r.by)} · ${ago(r.date)}</div>
          ${r.status === 'fulfilled'
            ? `<div class="text-xs text-emerald-700 font-medium">Listed by ${isMe(r.fulfilledBy) ? 'you' : esc(r.fulfilledBy)} 🎉</div>`
            : isMe(r.by)
              ? `<button data-action="closeReq" data-req="${r.id}" class="${btn} border border-slate-200 hover:border-slate-400">Close request</button>`
              : `<button data-action="haveIt" data-req="${r.id}" class="${btn} bg-amber-500 hover:bg-amber-600 text-white font-semibold"><i data-lucide="heart-handshake" class="w-4 h-4"></i>I have one</button>`}
        </div>`).join('') || '<div class="text-sm text-slate-500 py-6">Nothing requested right now. Everyone has what they need!</div>'}
    </div>`;
}

function renderImpact() {
  const sum = (list, k) => list.reduce((s, l) => s + meta(l.category)[k], 0);
  const byOwner = {}, byTool = {};
  for (const l of loans) {
    if (l.owner) { const o = (byOwner[l.owner] ??= { name: l.owner, n: 0, saved: 0 }); o.n++; o.saved += meta(l.category).value; }
    (byTool[l.toolId] ??= { id: l.toolId, name: l.tool, n: 0 }).n++;
  }
  const sharers = Object.values(byOwner).sort((a, b) => b.n - a.n).slice(0, 5);
  const popular = Object.values(byTool).sort((a, b) => b.n - a.n).slice(0, 5);
  const people = [...new Set([...allAccounts().map(a => a.name), ...loans.map(l => l.borrower)])]
    .map(name => ({ name, t: trust(name) })).filter(p => p.t.done >= 2)
    .sort((a, b) => b.t.rate - a.t.rate || b.t.done - a.t.done).slice(0, 5);
  const medal = i => ['🥇', '🥈', '🥉'][i] || `<span class="text-slate-400 text-sm">#${i + 1}</span>`;
  const mine = user ? loans.filter(l => isMe(l.borrower)) : [];
  const lent = user ? loans.filter(l => isMe(l.owner)) : [];
  const tile = (value, label, icon) => `
    <div class="bg-white/10 rounded-xl p-3">
      <div class="text-2xl font-bold">${value}</div>
      <div class="text-xs text-emerald-100 flex items-center gap-1"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</div>
    </div>`;
  const card = (icon, color, title, body) => `
    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <div class="font-semibold mb-3 flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 ${color}"></i>${title}</div>
      <ol class="space-y-3">${body || '<li class="text-sm text-slate-500">No loans yet.</li>'}</ol>
    </div>`;
  $('impact').innerHTML = `
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="leaf" class="w-5 h-5 text-emerald-600"></i>Community impact</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-gradient-to-br from-emerald-700 to-teal-700 text-white rounded-2xl p-5 flex flex-col">
        <div class="grid grid-cols-2 gap-3">
          ${tile(loans.length, 'loans made', 'repeat')}
          ${tile(money(sum(loans, 'value')), 'not spent', 'piggy-bank')}
          ${tile(Math.round(sum(loans, 'co2')).toLocaleString() + ' kg', 'CO₂e avoided', 'cloud')}
          ${tile(Math.round(sum(loans, 'kg')).toLocaleString() + ' kg', 'kept from landfill', 'trash-2')}
        </div>
        ${user ? `<div class="mt-4 text-sm bg-white/10 rounded-xl p-3">
          <b>You:</b> borrowed ${mine.length}× (saved ${money(sum(mine, 'value'))}) · your tools lent ${lent.length}×
        </div>` : ''}
        <div class="mt-auto pt-4 text-[11px] text-emerald-100/80">Estimates: each loan counts as one new tool not bought, using typical retail prices and manufacturing footprints.</div>
      </div>
      ${card('trophy', 'text-amber-500', 'Top sharers', sharers.map((o, i) => `
        <li class="flex items-center gap-3">
          <span class="w-6 text-center">${medal(i)}</span>${avatar(o.name)}
          <span class="flex-1 min-w-0"><span class="block font-medium truncate">${isMe(o.name) ? 'You' : esc(o.name)}</span>
          <span class="block text-xs text-slate-500">lent ${o.n}× · saved neighbors ${money(o.saved)}</span></span>
        </li>`).join(''))}
      ${card('flame', 'text-rose-500', 'Most borrowed', popular.map(p => {
        const t = toolById(p.id) || { name: p.name, category: '', photo: '' };
        return `
        <li><button data-id="${p.id}" class="w-full flex items-center gap-3 text-left hover:bg-slate-50 rounded-xl -m-1 p-1">
          <span class="w-10 h-10 rounded-lg overflow-hidden shrink-0">${photoHTML(t, 'w-5 h-5')}</span>
          <span class="flex-1 min-w-0 font-medium truncate">${esc(t.name)}</span>
          <span class="text-sm text-slate-500 shrink-0">${p.n} loans</span>
        </button></li>`; }).join(''))}
      ${card('shield-check', 'text-emerald-600', 'Most reliable borrowers', people.map(p => `
        <li class="flex items-center gap-3">
          ${avatar(p.name)}
          <span class="flex-1 min-w-0"><span class="block font-medium truncate">${isMe(p.name) ? 'You' : esc(p.name)}</span>
          <span class="block text-xs text-slate-500">${esc(p.t.detail)}</span></span>
          ${trustBadge(p.name)}
        </li>`).join(''))}
    </div>`;
}

function render() {
  renderAccount();
  renderStats();
  renderFilters();
  const q = query.trim().toLowerCase();
  const list = tools
    .filter(t => activeCategory === 'All'
      || (activeCategory === 'Mine'
        ? user && (isMe(t.borrower) || isMe(t.owner) || t.waitlist.some(isMe) || t.reservations.some(r => isMe(r.name)))
        : t.category === activeCategory))
    .filter(t => !q || [t.name, t.category, t.borrower, t.owner].some(s => s.toLowerCase().includes(q)))
    .sort((a, b) => (a.status === b.status ? a.id - b.id : a.status === 'Available' ? -1 : 1));
  $('grid').innerHTML = list.map(cardHTML).join('');
  $('empty').classList.toggle('hidden', list.length > 0);
  $('emptyText').textContent = activeCategory === 'Mine' && !q
    ? "You haven't borrowed, booked or shared anything yet."
    : 'No tools match your search.';
  $('emptyAsk').innerHTML = q
    ? `<button data-action="ask" data-q="${esc(query.trim())}" class="inline-flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold px-4 py-2 rounded-lg"><i data-lucide="megaphone" class="w-4 h-4"></i>Ask the street for “${esc(query.trim())}”</button>`
    : '';
  renderRequests();
  renderImpact();
  lucide.createIcons();
  flashId = null;
}

// ─── Modals ────────────────────────────────────────────────────────────────
function openModal(html, focus = true, width = 'max-w-md') {
  $('modalCard').className = `bg-white rounded-2xl w-full ${width} shadow-xl card-enter max-h-[90vh] overflow-y-auto`;
  $('modalBody').innerHTML = html;
  $('modal').classList.remove('hidden');
  lucide.createIcons();
  if (focus) $('modalBody').querySelector('input:not([type=file]):not([type=date]):not([type=radio])')?.focus();
}
function closeModal() { $('modal').classList.add('hidden'); }

function modalHero(t) {
  const m = meta(t.category);
  const owner = isMe(t.owner);
  return `
    <div class="relative aspect-[4/3] w-full overflow-hidden rounded-t-2xl">
      ${photoHTML(t, 'w-16 h-16')}
      <button data-close class="absolute top-3 right-3 w-8 h-8 grid place-items-center rounded-full bg-white/90 text-slate-600 hover:text-slate-900 shadow"><i data-lucide="x" class="w-4 h-4"></i></button>
      <div class="absolute top-3 left-3">${badgeHTML(t)}</div>
      ${PHOTO_CREDITS[t.photo] ? `
        <a href="${esc(PHOTO_CREDITS[t.photo].url)}" target="_blank" rel="noopener" class="absolute bottom-2 left-2 max-w-[60%] truncate text-[10px] text-white/90 bg-black/40 hover:bg-black/60 px-2 py-0.5 rounded-full">
          Photo: ${esc(PHOTO_CREDITS[t.photo].author)} · ${esc(PHOTO_CREDITS[t.photo].license)}</a>` : ''}
      ${owner ? `
        <label class="absolute bottom-3 right-3 inline-flex items-center gap-1.5 bg-white/90 hover:bg-white text-slate-800 text-xs font-medium px-3 py-1.5 rounded-full shadow cursor-pointer">
          <i data-lucide="camera" class="w-4 h-4"></i>${t.photo ? 'Change photo' : 'Add photo'}
          <input id="ownerPhoto" type="file" accept="image/*" class="hidden" />
        </label>` : ''}
    </div>
    <div class="px-6 pt-5">
      <div class="font-semibold text-xl">${esc(t.name)}</div>
      <div class="text-sm text-slate-500">${esc(t.category)} · saves ~$${m.value} vs buying</div>
      ${t.owner ? `<div class="mt-3 flex items-center gap-2 text-sm flex-wrap">${avatar(t.owner, 'w-6 h-6 text-[10px]')}<span>Shared by <b>${owner ? 'you' : esc(t.owner)}</b></span></div>` : ''}
    </div>`;
}

function section(icon, color, title, body, id = '') {
  return `
    <div ${id ? `id="${id}"` : ''} class="rounded-xl border border-slate-200 p-4 space-y-3">
      <div class="text-sm font-semibold flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 ${color}"></i>${title}</div>
      ${body}
    </div>`;
}

function conditionHTML(t) {
  if (t.condition === 'Good') return '';
  const broken = isBroken(t);
  return `
    <div class="rounded-xl ${broken ? 'bg-slate-100 text-slate-800' : 'bg-amber-50 text-amber-900'} p-4 text-sm space-y-2">
      <div class="font-semibold flex items-center gap-2"><i data-lucide="${broken ? 'circle-alert' : 'wrench'}" class="w-4 h-4"></i>${broken ? 'Out for repair' : 'Needs attention'}</div>
      ${t.conditionNote ? `<div>“${esc(t.conditionNote)}”</div>` : ''}
      ${isMe(t.owner) ? `<button data-action="fixed" data-tool="${t.id}" class="w-full bg-white border border-slate-200 hover:border-slate-400 font-medium py-2 rounded-lg inline-flex items-center justify-center gap-1.5"><i data-lucide="check" class="w-4 h-4"></i>Mark as fixed</button>` : ''}
    </div>`;
}

function borrowHTML(t, held) {
  const btn = 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl inline-flex items-center justify-center gap-2';
  if (!user) return `<form id="checkoutForm"><button class="${btn}"><i data-lucide="log-in" class="w-5 h-5"></i>Sign in to borrow</button></form>`;
  if (isMe(t.owner)) return `<div class="text-sm text-slate-500 text-center">This is yours. Neighbors can borrow it while it's available.</div>`;
  const myRes = activeRes(t) && isMe(activeRes(t).name) ? activeRes(t) : null;
  const next = nextResFor(t, user.name);
  const max = next ? shiftISO(next.start, -1) : '';
  let due = myRes ? myRes.end : addDays(LOAN_DAYS);
  if (max && due > max) due = max;
  return `
    <form id="checkoutForm" class="space-y-3">
      ${held ? `<div class="rounded-xl bg-violet-50 text-violet-800 p-3 text-sm">🎉 It's your turn, this one is ${myRes ? 'booked' : 'held'} for you.</div>` : ''}
      <div class="flex items-center gap-2 text-sm text-slate-600">${avatar(user.name, 'w-6 h-6 text-[10px]')}Borrowing as <b>${esc(user.name)}</b></div>
      <label class="block">
        <span class="text-sm font-medium">Return by</span>
        <input name="due" type="date" required min="${todayISO()}" ${max ? `max="${max}"` : ''} value="${due}" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </label>
      ${next ? `<div class="text-xs text-violet-700 flex items-center gap-1.5"><i data-lucide="calendar-days" class="w-3.5 h-3.5"></i>${esc(firstName(next.name))} booked it from ${fmtDay(next.start)}, so it's due back by ${fmtDate(max)}.</div>` : ''}
      <button class="${btn}"><i data-lucide="hand-helping" class="w-5 h-5"></i>Borrow</button>
    </form>`;
}

function waitlistHTML(t) {
  const pos = t.waitlist.findIndex(isMe);
  const list = t.waitlist.length
    ? `<ol class="space-y-2">${t.waitlist.map((n, i) => `
        <li class="flex items-center gap-2 text-sm flex-wrap"><span class="w-5 text-slate-400">${i + 1}.</span>${avatar(n, 'w-6 h-6 text-[10px]')}<span class="${isMe(n) ? 'font-semibold' : ''}">${isMe(n) ? 'You' : esc(n)}</span>${trustBadge(n)}</li>`).join('')}</ol>`
    : '<div class="text-sm text-slate-500">Nobody waiting yet.</div>';
  let btn = '';
  if (!isMe(t.borrower) && !isMe(t.owner)) {
    btn = pos >= 0
      ? `<button data-action="leave" data-tool="${t.id}" class="w-full border border-slate-200 hover:border-slate-400 text-sm font-medium py-2.5 rounded-xl">Leave the line (you're #${pos + 1})</button>`
      : `<button data-action="join" data-tool="${t.id}" class="w-full bg-violet-600 hover:bg-violet-700 text-white text-sm font-semibold py-2.5 rounded-xl inline-flex items-center justify-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i>${user ? 'Join the line' : 'Sign in to join the line'}</button>`;
  }
  return section('users', 'text-violet-600', `Waitlist${t.waitlist.length ? ` · ${t.waitlist.length}` : ''}`, list + btn, 'waitlistBox');
}

// Prefilled WhatsApp / SMS links; nothing is sent until the user hits send in their app.
function nudgeHTML(to, text, label, id = 'nudgeBox') {
  const phone = (accountFor(to)?.phone || '').replace(/[^\d+]/g, '');
  const enc = encodeURIComponent(text);
  const wa = `https://wa.me/${phone.replace('+', '')}?text=${enc}`;
  const sms = `sms:${phone}?&body=${enc}`;
  return section('bell-ring', 'text-amber-500', label, `
      <div class="text-sm text-slate-600 bg-slate-50 rounded-lg p-3">${esc(text)}</div>
      <div class="grid grid-cols-3 gap-2 text-sm font-medium">
        <a href="${esc(wa)}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-1.5 bg-[#25D366] hover:brightness-95 text-white py-2 rounded-lg"><i data-lucide="message-circle" class="w-4 h-4"></i>WhatsApp</a>
        <a href="${esc(sms)}" class="inline-flex items-center justify-center gap-1.5 bg-sky-600 hover:bg-sky-700 text-white py-2 rounded-lg"><i data-lucide="smartphone" class="w-4 h-4"></i>SMS</a>
        <button data-action="copy" data-text="${esc(text)}" class="inline-flex items-center justify-center gap-1.5 border border-slate-200 hover:border-slate-400 py-2 rounded-lg"><i data-lucide="copy" class="w-4 h-4"></i>Copy</button>
      </div>`, id);
}

// Two-week availability strip plus the booking form.
function calendarHTML(t) {
  const today = todayISO();
  const cells = [...Array(14)].map((_, i) => {
    const d = addDays(i);
    const out = t.status === 'Checked Out' && (d <= t.due || (isOverdue(t) && d === today));
    const res = t.reservations.find(r => r.start <= d && d <= r.end);
    const dt = new Date(d + 'T00:00:00');
    const label = `<span class="block text-[10px] uppercase opacity-70">${dt.toLocaleDateString(undefined, { weekday: 'narrow' })}</span><span class="block font-semibold">${dt.getDate()}</span>`;
    if (out) return `<div title="Out with ${esc(t.borrower)}" class="rounded-lg py-1.5 text-center text-xs ${isOverdue(t) ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">${label}</div>`;
    if (res) return `<div title="Booked by ${esc(res.name)}" class="rounded-lg py-1.5 text-center text-xs ${isMe(res.name) ? 'bg-violet-600 text-white' : 'bg-violet-100 text-violet-700'}">${label}</div>`;
    return `<button type="button" data-action="day" data-day="${d}" title="Free" class="rounded-lg py-1.5 text-center text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 ${isBroken(t) ? 'opacity-50' : ''}">${label}</button>`;
  }).join('');
  const bookings = t.reservations.map(r => `
    <li class="flex items-center gap-2 text-sm">
      ${avatar(r.name, 'w-6 h-6 text-[10px]')}
      <span class="flex-1 min-w-0 truncate"><b>${isMe(r.name) ? 'You' : esc(firstName(r.name))}</b> · ${fmtDate(r.start)}${r.end !== r.start ? `–${fmtDate(r.end)}` : ''}</span>
      ${isMe(r.name) || isMe(t.owner) ? `<button data-action="unres" data-tool="${t.id}" data-name="${esc(r.name)}" data-start="${r.start}" class="text-xs text-slate-500 hover:text-red-600 underline">Cancel</button>` : ''}
    </li>`).join('');
  const canBook = user && !isMe(t.owner) && !isBroken(t);
  const input = 'mt-1 w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm';
  const form = !user
    ? `<button data-action="bookLogin" data-tool="${t.id}" class="w-full border border-slate-200 hover:border-slate-400 text-sm font-medium py-2.5 rounded-xl">Sign in to book dates</button>`
    : canBook ? `
      <form id="resForm" class="grid grid-cols-[1fr_1fr_auto] gap-2 items-end">
        <label class="text-xs font-medium">From<input id="resStart" name="start" type="date" min="${today}" required class="${input}" /></label>
        <label class="text-xs font-medium">To<input id="resEnd" name="end" type="date" min="${today}" required class="${input}" /></label>
        <button class="bg-slate-900 hover:bg-slate-700 text-white text-sm font-semibold px-4 py-2 rounded-xl">Book</button>
      </form>
      <div class="text-[11px] text-slate-500">Tip: tap a green day to start, then a later one to set the end.</div>` : '';
  return section('calendar-days', 'text-sky-600', 'Availability · next 2 weeks', `
      <div class="grid grid-cols-7 gap-1">${cells}</div>
      <div class="flex flex-wrap gap-3 text-[11px] text-slate-500">
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-100"></span>Free</span>
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-100"></span>Borrowed</span>
        <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-violet-100"></span>Booked</span>
      </div>
      ${bookings ? `<ul class="space-y-2">${bookings}</ul>` : ''}
      ${form}`, 'calendarBox');
}

function historyHTML(t) {
  const list = loans.filter(l => l.toolId === t.id).slice(-5).reverse();
  if (!list.length) return '';
  const tone = { 'Needs attention': 'bg-amber-100 text-amber-800', Broken: 'bg-red-100 text-red-700' };
  return `
    <details class="rounded-xl border border-slate-200 p-4 group">
      <summary class="text-sm font-semibold flex items-center gap-2 cursor-pointer">
        <i data-lucide="history" class="w-4 h-4 text-slate-500"></i>Loan history · ${loans.filter(l => l.toolId === t.id).length}
        <i data-lucide="chevron-down" class="w-4 h-4 ml-auto text-slate-400 group-open:rotate-180 transition"></i>
      </summary>
      <ul class="mt-3 space-y-3">${list.map(l => {
        const late = l.returned && l.due && l.returned > l.due ? daysBetween(l.due, l.returned) : 0;
        return `
        <li class="flex gap-2 text-sm">
          ${avatar(l.borrower, 'w-6 h-6 text-[10px]')}
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap"><b>${isMe(l.borrower) ? 'You' : esc(l.borrower)}</b>
              <span class="text-slate-500">${fmtDate(l.date)} → ${l.returned ? fmtDate(l.returned) : 'now'}</span>
              ${!l.returned ? '<span class="text-xs text-amber-700">out</span>' : late ? `<span class="text-xs text-red-600">${late}d late</span>` : '<span class="text-xs text-emerald-700">on time</span>'}
              ${tone[l.condition] ? `<span class="text-[11px] px-1.5 py-0.5 rounded-full ${tone[l.condition]}">${esc(l.condition)}</span>` : ''}
            </div>
            ${l.note ? `<div class="text-slate-500 text-xs mt-0.5">“${esc(l.note)}”</div>` : ''}
          </div>
        </li>`; }).join('')}</ul>
    </details>`;
}

function wireOwnerPhoto(id) {
  const input = $('ownerPhoto');
  if (!input) return;
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try { setPhoto(id, await compressImage(file)); }
    catch { toast('Could not use that image, try another', true); }
  };
}

function openTool(id) {
  const t = toolById(id);
  if (!t) return;
  const held = heldFor(t);
  const res = activeRes(t);
  const overdue = isOverdue(t);
  const parts = [conditionHTML(t)];

  if (t.status === 'Checked Out') {
    const canReturn = user && (isMe(t.borrower) || isMe(t.owner));
    parts.push(`
      <div id="loanStatus" class="rounded-xl ${overdue ? 'bg-red-50 text-red-800' : 'bg-amber-50 text-amber-800'} p-4 text-sm space-y-1">
        <div class="flex items-center gap-2 flex-wrap">${avatar(t.borrower, 'w-6 h-6 text-[10px]')}<span>Borrowed by <b>${isMe(t.borrower) ? 'you' : esc(t.borrower)}</b></span>${trustBadge(t.borrower)}</div>
        ${t.due ? `<div>${overdue ? `Was due <b>${fmtDate(t.due)}</b>, ${daysBetween(t.due, todayISO())} days ago.` : `Due back <b>${fmtDay(t.due)}</b>.`}</div>` : ''}
      </div>`);
    parts.push(canReturn
      ? `<button id="returnBtn" class="w-full bg-slate-900 hover:bg-slate-700 text-white font-semibold py-3 rounded-xl inline-flex items-center justify-center gap-2"><i data-lucide="undo-2" class="w-5 h-5"></i>Return tool</button>`
      : user
        ? `<div class="text-sm text-slate-500 text-center">Only ${esc(t.borrower)}${t.owner ? ` or ${esc(t.owner)}` : ''} can mark this returned.</div>`
        : `<button id="returnLogin" class="w-full border border-slate-200 hover:border-slate-400 font-semibold py-3 rounded-xl inline-flex items-center justify-center gap-2"><i data-lucide="log-in" class="w-5 h-5"></i>Sign in to return</button>`);
    if (overdue && user && !isMe(t.borrower) && (isMe(t.owner) || t.waitlist.some(isMe))) {
      parts.push(nudgeHTML(t.borrower,
        `Hi ${firstName(t.borrower)}! Friendly reminder from BorrowBloc: ${isMe(t.owner) ? 'my' : 'the'} ${t.name}${t.owner && !isMe(t.owner) ? ` (${firstName(t.owner)}'s)` : ''} was due back ${fmtDate(t.due)}.${t.waitlist.length ? ` ${t.waitlist.length} ${t.waitlist.length === 1 ? 'neighbor is' : 'neighbors are'} waiting for it.` : ''} Could you drop it back when you get a chance? Thanks!`,
        `Nudge ${esc(firstName(t.borrower))}`));
    }
    parts.push(waitlistHTML(t));
  } else if (!isBroken(t)) {
    if (held && !isMe(held)) {
      parts.push(`<div id="loanStatus" class="rounded-xl bg-violet-50 text-violet-800 p-4 text-sm">${res
        ? `Booked by <b>${esc(held)}</b> ${res.end > todayISO() ? `through ${fmtDay(res.end)}` : 'for today'}.`
        : `Just returned and held for <b>${esc(held)}</b>, who's first in line.`}</div>`);
      if (!res) {
        parts.push(waitlistHTML(t));
        if (isMe(t.owner)) parts.push(`<button data-action="release" data-tool="${t.id}" class="w-full text-sm text-slate-500 hover:text-slate-800 underline">Release hold (skip ${esc(firstName(held))})</button>`);
      }
    } else {
      parts.push(borrowHTML(t, held));
    }
  }
  parts.push(calendarHTML(t), historyHTML(t));
  openModal(`${modalHero(t)}<div class="p-6 pt-4 space-y-4">${parts.join('')}</div>`, false);

  if ($('checkoutForm')) $('checkoutForm').onsubmit = e => {
    e.preventDefault();
    if (!user) return requireUser(() => openTool(id));
    checkout(id, new FormData(e.target).get('due'));
  };
  if ($('returnBtn')) $('returnBtn').onclick = () => openReturn(id);
  if ($('returnLogin')) $('returnLogin').onclick = () => requireUser(() => openTool(id));
  if ($('resForm')) $('resForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    reserve(id, f.get('start'), f.get('end'));
  };
  wireOwnerPhoto(id);
}

function openReturn(id) {
  const t = toolById(id);
  const opts = [['Good', 'thumbs-up', 'emerald'], ['Needs attention', 'wrench', 'amber'], ['Broken', 'circle-alert', 'red']];
  openModal(`
    <div class="p-6 space-y-4">
      <div class="flex items-start justify-between">
        <div><div class="font-semibold text-lg">Return the ${esc(t.name)}</div><div class="text-sm text-slate-500">A quick check keeps the library in good shape.</div></div>
        <button data-close class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="returnForm" class="space-y-4">
        <div class="text-sm font-medium">How's it looking?</div>
        <div class="grid grid-cols-3 gap-2">${opts.map(([v, icon, c], i) => `
          <label class="cursor-pointer">
            <input type="radio" name="condition" value="${v}" class="peer sr-only" ${i === 0 ? 'checked' : ''} />
            <span class="flex flex-col items-center gap-1 p-3 rounded-xl border-2 border-slate-200 text-sm text-center peer-checked:border-${c}-500 peer-checked:bg-${c}-50">
              <i data-lucide="${icon}" class="w-5 h-5 text-${c}-600"></i>${v}</span>
          </label>`).join('')}</div>
        <textarea name="note" rows="2" maxlength="140" placeholder="Anything the owner should know? (optional)" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"></textarea>
        <button class="w-full bg-slate-900 hover:bg-slate-700 text-white font-semibold py-3 rounded-xl inline-flex items-center justify-center gap-2"><i data-lucide="undo-2" class="w-5 h-5"></i>Confirm return</button>
      </form>
    </div>`, false);
  $('returnForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    giveBack(id, f.get('condition'), f.get('note').trim());
  };
}

function openAdd({ name = '', requestId = null } = {}) {
  const req = requests.find(r => r.id === requestId);
  const opts = [...new Set([...Object.keys(CATEGORY_META), ...tools.map(t => t.category)])]
    .map(c => `<option>${esc(c)}</option>`).join('');
  openModal(`
    <div class="p-6 pb-0 flex items-start justify-between">
      <div><div class="font-semibold text-lg">Share a tool</div><div class="text-sm text-slate-500">List something from your garage for the street.</div></div>
      <button data-close class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="addForm" class="p-6 space-y-4">
      ${req ? `<div class="rounded-xl bg-amber-50 text-amber-900 p-3 text-sm flex items-center gap-2">${avatar(req.by, 'w-6 h-6 text-[10px]')}<span>Answering <b>${esc(firstName(req.by))}</b>'s request 🙌</span></div>` : ''}
      <label class="block cursor-pointer">
        <span class="text-sm font-medium">Photo</span>
        <div id="addPreview" class="mt-1 aspect-[4/3] rounded-xl border-2 border-dashed border-slate-200 hover:border-emerald-500 overflow-hidden grid place-items-center text-slate-400 text-sm">
          <span class="flex flex-col items-center gap-1"><i data-lucide="image-plus" class="w-8 h-8"></i>Tap to add a photo</span>
        </div>
        <input id="addPhoto" type="file" accept="image/*" class="hidden" />
      </label>
      <label class="block"><span class="text-sm font-medium">Tool name</span>
        <input name="name" required maxlength="40" value="${esc(name)}" placeholder="e.g. Tile Cutter" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" /></label>
      <label class="block"><span class="text-sm font-medium">Category</span>
        <select name="category" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">${opts}</select></label>
      <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl">List it</button>
    </form>`);
  const getPhoto = photoPicker('addPhoto', 'addPreview');
  $('addForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    addTool(f.get('name').trim(), f.get('category'), getPhoto(), requestId);
  };
}

function openAsk(prefill = '') {
  openModal(`
    <div class="p-6 pb-0 flex items-start justify-between">
      <div><div class="font-semibold text-lg">Ask the street</div><div class="text-sm text-slate-500">Post what you need. Someone nearby probably has one.</div></div>
      <button data-close class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="askForm" class="p-6 space-y-4">
      <label class="block"><span class="text-sm font-medium">What do you need?</span>
        <input name="tool" required maxlength="40" value="${esc(prefill)}" placeholder="e.g. Tile Saw" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" /></label>
      <label class="block"><span class="text-sm font-medium">What's it for? <span class="text-slate-400 font-normal">(optional)</span></span>
        <input name="note" maxlength="100" placeholder="e.g. Redoing the bathroom floor" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" /></label>
      <button class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded-xl inline-flex items-center justify-center gap-2"><i data-lucide="megaphone" class="w-5 h-5"></i>Post request</button>
    </form>`);
  $('askForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    askTool(f.get('tool').trim(), f.get('note').trim());
  };
}

let toastTimer;
function toast(msg, error = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] text-white text-sm px-4 py-2.5 rounded-xl shadow-lg ${error ? 'bg-red-600' : 'bg-slate-900'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

// ─── Guided tour ───────────────────────────────────────────────────────────
// Walks through the pitch on a scratch copy of the data; everything resets at the end.
const TOUR_STEPS = [
  { el: () => $('hero'), title: 'Meet BorrowBloc',
    text: 'Every garage on the street has a drill that gets used for 13 minutes in its whole life. BorrowBloc turns the street into one shared tool library.',
    before: () => { closeModal(); window.scrollTo({ top: 0 }); } },
  { el: () => $('stats'), title: 'The whole street at a glance',
    text: "Everything neighbors have listed, what's free right now, and how much sharing has already saved." },
  { el: () => $('account'), title: 'No passwords, no friction',
    text: "Ria picks her name and she's in. That's the entire sign-up.",
    before: () => setUser(accountFor('Ria Nimbkar')) },
  { el: () => $('checkoutForm'), title: 'Borrow in one tap',
    text: 'Ria needs a drill. Soorya already booked it for later this week, so BorrowBloc sets her return date before then. No double-booking, no awkward texts.',
    before: () => openTool(1) },
  { el: () => document.querySelector('#grid [data-id="1"]'), title: 'Done, and synced',
    text: 'The drill flips to Checked Out for the whole street, and the Google Sheet behind it updates live.',
    before: async () => { await checkout(1, $('checkoutForm').querySelector('[name=due]').value); } },
  { el: () => $('loanStatus'), title: 'Trust, built in',
    text: 'Every return builds a track record. Marcus is 5 days late with Sarah’s pressure washer, and his badge shows it.',
    before: () => { setUser(accountFor('Sarah Jenkins')); openTool(5); } },
  { el: () => $('nudgeBox'), title: 'A friendly nudge',
    text: 'One tap opens WhatsApp or SMS with a polite reminder already written. Nobody has to be the bad guy.' },
  { el: () => $('waitlistBox'), title: 'A fair line',
    text: "Two neighbors are waiting. When it comes back, it's held for whoever's next, and they get a heads-up." },
  { el: () => $('calendarBox'), title: 'Book ahead',
    text: 'Planning a weekend project? Reserve dates in advance. Returns also log the tool’s condition, so owners know what they’re getting back.' },
  { el: () => $('requests'), title: 'Ask the street',
    text: "Can't find something? Post a request. Ria wants a tile saw; anyone who has one can list it in seconds.",
    before: () => closeModal() },
  { el: () => $('impact'), title: 'It adds up',
    text: () => `${loans.length} loans so far: ${money(loans.reduce((s, l) => s + meta(l.category).value, 0))} not spent and ${Math.round(loans.reduce((s, l) => s + meta(l.category).co2, 0)).toLocaleString()} kg of CO₂ avoided. One drill at a time.` },
];

function startTour() {
  if (tour) return;
  closeModal();
  tour = { i: -1, el: null, snap: JSON.stringify({ tools, loans, requests, user, activeCategory, query }) };
  activeCategory = 'All'; query = ''; $('search').value = '';
  $('tourBlock').classList.remove('hidden');
  nextTourStep();
}

async function nextTourStep() {
  if (!tour) return;
  tour.i++;
  if (tour.i >= TOUR_STEPS.length) return endTour();
  const step = TOUR_STEPS[tour.i];
  $('tourCard').classList.add('hidden');
  await step.before?.();
  await sleep(80);
  const el = step.el();
  if (!el) return nextTourStep();
  tour.el = el;
  // Instant scroll so the spotlight never measures a half-scrolled page; the spotlight itself animates.
  el.scrollIntoView({ block: 'center' });
  await sleep(60);
  placeTour();
}

function placeTour() {
  if (!tour?.el) return;
  const step = TOUR_STEPS[tour.i];
  const r = tour.el.getBoundingClientRect();
  const pad = 8, vw = innerWidth, vh = innerHeight;
  const top = Math.max(8, r.top - pad), bottom = Math.min(vh - 8, r.bottom + pad);
  const left = Math.max(8, r.left - pad), right = Math.min(vw - 8, r.right + pad);
  Object.assign($('tourSpot').style, { top: top + 'px', left: left + 'px', width: right - left + 'px', height: bottom - top + 'px' });
  $('tourSpot').classList.remove('hidden');

  const last = tour.i === TOUR_STEPS.length - 1;
  const card = $('tourCard');
  card.innerHTML = `
    <div class="text-xs font-semibold text-emerald-600 mb-1">${tour.i + 1} / ${TOUR_STEPS.length}</div>
    <div class="font-semibold text-lg leading-snug">${esc(step.title)}</div>
    <p class="text-sm text-slate-600 mt-1">${esc(typeof step.text === 'function' ? step.text() : step.text)}</p>
    <div class="flex items-center justify-between mt-4">
      <button data-tour="exit" class="text-sm text-slate-500 hover:text-slate-800">Exit tour</button>
      <button data-tour="next" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">
        ${last ? 'Finish & reset' : 'Next'}<i data-lucide="${last ? 'rotate-ccw' : 'arrow-right'}" class="w-4 h-4"></i></button>
    </div>
    <div class="flex gap-1 mt-3">${TOUR_STEPS.map((_, i) => `<span class="h-1 flex-1 rounded-full ${i <= tour.i ? 'bg-emerald-500' : 'bg-slate-200'}"></span>`).join('')}</div>`;
  card.classList.remove('hidden');
  lucide.createIcons();
  const w = card.offsetWidth, h = card.offsetHeight;
  let y = bottom + 12;
  if (y + h > vh - 8) y = top - h - 12;
  if (y < 8) y = Math.max(8, vh - h - 16);
  const x = Math.min(Math.max(16, left), vw - w - 16);
  Object.assign(card.style, { top: y + 'px', left: x + 'px' });
}

function endTour() {
  if (!tour) return;
  const s = JSON.parse(tour.snap);
  tools = s.tools; loans = s.loans; requests = s.requests; user = s.user; activeCategory = s.activeCategory; query = s.query;
  $('search').value = query;
  if (user) store.set(KEYS.user, user); else store.del(KEYS.user);
  tour = null;
  ['tourBlock', 'tourSpot', 'tourCard'].forEach(id => $(id).classList.add('hidden'));
  closeModal();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('Tour finished, demo data reset');
}

$('tourCard').addEventListener('click', e => {
  const b = e.target.closest('[data-tour]'); if (!b) return;
  if (b.dataset.tour === 'next') nextTourStep(); else endTour();
});
addEventListener('resize', placeTour);
addEventListener('scroll', placeTour, { passive: true });
$('modalCard').addEventListener('scroll', placeTour, { passive: true });

// ─── Wiring ────────────────────────────────────────────────────────────────
$('grid').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c) openTool(Number(c.dataset.id)); });
$('impact').addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c) openTool(Number(c.dataset.id)); });
$('filters').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { activeCategory = b.dataset.cat; render(); } });
$('search').addEventListener('input', e => { query = e.target.value; render(); });
$('addBtn').onclick = () => requireUser(() => openAdd());
$('tourBtn').onclick = startTour;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) { afterLogin = null; closeModal(); } });

// One handler for every data-action button (modals, wish list, empty state).
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action;
  const id = Number(b.dataset.tool);
  const t = toolById(id);
  const req = requests.find(r => r.id === Number(b.dataset.req));
  if (a === 'join') requireUser(() => joinWaitlist(id));
  if (a === 'leave') leaveWaitlist(id, user.name);
  if (a === 'release') leaveWaitlist(id, t.waitlist[0]);
  if (a === 'fixed') markFixed(id);
  if (a === 'unres') unreserve(id, b.dataset.name, b.dataset.start);
  if (a === 'bookLogin') requireUser(() => openTool(id));
  if (a === 'ask') requireUser(() => openAsk(b.dataset.q || ''));
  if (a === 'haveIt' && req) requireUser(() => openAdd({ name: req.tool, requestId: req.id }));
  if (a === 'closeReq' && req) closeRequest(req.id);
  if (a === 'day') {
    // First tap sets the start; a later tap extends to that end date.
    const s = $('resStart'), en = $('resEnd'); if (!s) return;
    const d = b.dataset.day;
    if (!s.value || d < s.value || (en.value && en.value !== s.value)) { s.value = d; en.value = d; }
    else en.value = d;
  }
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(b.dataset.text); toast('Message copied'); }
    catch { toast('Could not copy, select the text instead', true); }
  }
});

document.addEventListener('keydown', e => {
  if (tour) {
    if (e.key === 'Escape') endTour();
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); nextTourStep(); }
    return;
  }
  if (e.key === 'Escape') { afterLogin = null; closeModal(); }
  if (e.key === '/' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); $('search').focus(); }
});

(async function init() {
  setupBranding();
  if (mode === 'live') {
    await fetchAll();
    if (!tools.length) { loadLocal(); mode = 'demo'; setSync('demo'); render(); toast('Sheet unreachable, running on demo data', true); }
    else setInterval(() => { if (!busy && !tour && document.visibilityState === 'visible') fetchAll(); }, POLL_MS);
  } else {
    loadLocal();
    setSync('demo');
    render();
  }
})();
</script>
