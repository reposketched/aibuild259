<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BorrowBloc - Neighborhood Tool Library</title>
  <link id="favicon" rel="icon" type="image/png" href="assets/image.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card-enter { animation: pop .25s ease-out; }
    @keyframes pop { from { transform: scale(.97); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    .flash { animation: flash 1.2s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 4px rgb(16 185 129 / .6) } 100% { box-shadow: 0 0 0 0 rgb(16 185 129 / 0) } }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    #tourSpot { box-shadow: 0 0 0 9999px rgb(15 23 42 / .6); transition: all .35s ease; }
    #tourCard { transition: top .35s ease, left .35s ease; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="logo" class="w-9 h-9 shrink-0 rounded-xl bg-emerald-600 text-white grid place-items-center overflow-hidden"><i data-lucide="hammer" class="w-5 h-5"></i></div>
        <div class="min-w-0">
          <div class="font-bold text-lg leading-tight">BorrowBloc</div>
          <div class="text-xs text-slate-500 leading-tight hidden sm:block">Neighborhood Tool Library</div>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <span id="syncBadge" class="hidden md:inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span> Connecting…
        </span>
        <button id="addBtn" class="inline-flex items-center gap-1.5 bg-slate-900 hover:bg-slate-700 text-white text-sm font-medium px-3 py-2 rounded-lg">
          <i data-lucide="plus" class="w-4 h-4"></i><span class="hidden sm:inline">Share a tool</span>
        </button>
        <div id="account"></div>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Hero -->
    <header id="hero" class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
      <div>
        <h1 id="greeting" class="text-2xl sm:text-3xl font-bold tracking-tight">Borrow it. Don't buy it.</h1>
        <p class="text-slate-500 mt-1">The average drill is used 13 minutes in its lifetime. Share what your street already owns.</p>
      </div>
      <button id="tourBtn" class="shrink-0 self-start sm:self-auto inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm">
        <i data-lucide="play" class="w-4 h-4"></i>Take the tour
      </button>
    </header>

    <!-- Stats banner -->
    <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="flex items-center gap-2 text-slate-500 text-sm"><i data-lucide="package" class="w-4 h-4"></i>Total tools</div>
        <div id="statTotal" class="text-3xl font-bold mt-1">–</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="flex items-center gap-2 text-emerald-600 text-sm"><i data-lucide="circle-check" class="w-4 h-4"></i>Available</div>
        <div id="statAvail" class="text-3xl font-bold mt-1 text-emerald-600">–</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4">
        <div class="flex items-center gap-2 text-amber-600 text-sm"><i data-lucide="clock" class="w-4 h-4"></i>Checked out</div>
        <div id="statOut" class="text-3xl font-bold mt-1 text-amber-600">–</div>
      </div>
      <div class="bg-gradient-to-br from-emerald-600 to-teal-600 text-white rounded-2xl p-4">
        <div class="flex items-center gap-2 text-emerald-50 text-sm"><i data-lucide="piggy-bank" class="w-4 h-4"></i>Saved by sharing</div>
        <div id="statSaved" class="text-3xl font-bold mt-1">$0</div>
        <div id="statSavedSub" class="text-xs text-emerald-100 mt-0.5">in purchases neighbors didn't make</div>
      </div>
    </section>

    <!-- Search + filters -->
    <section class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="search" type="search" placeholder="Search tools, categories or neighbors…"
          class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>
      <div id="filters" class="flex gap-2 overflow-x-auto"></div>
    </section>

    <!-- Grid -->
    <section id="grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></section>
    <div id="empty" class="hidden text-center py-16 text-slate-500">
      <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
      <div id="emptyText">No tools match your search.</div>
      <div id="emptyAsk" class="mt-3"></div>
    </div>

    <!-- Wish list -->
    <section id="requests" class="mt-10"></section>

    <!-- Community impact -->
    <section id="impact" class="mt-10"></section>
  </main>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm grid place-items-center p-4">
    <div id="modalCard" class="bg-white rounded-2xl w-full max-w-md shadow-xl card-enter max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true">
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Guided tour -->
  <div id="tourBlock" class="hidden fixed inset-0 z-[60]"></div>
  <div id="tourSpot" class="hidden fixed z-[61] rounded-2xl pointer-events-none ring-2 ring-emerald-400"></div>
  <div id="tourCard" class="hidden fixed z-[62] w-[min(360px,calc(100vw-32px))] bg-white rounded-2xl shadow-2xl p-5"></div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg"></div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
// Paste your Google Apps Script Web App URL here (see apps-script/Code.gs).
// Leave empty to run in demo mode with local data saved in the browser.
const SHEET_ENDPOINT = '';
const POLL_MS = 5000;
const LOAN_DAYS = 7;
const MAX_BOOKING_DAYS = 14;
const MAX_PHOTO_CHARS = 45000;   // a Google Sheets cell holds at most 50k characters
const KEYS = { tools: 'bb2_tools', loans: 'bb2_loans', requests: 'bb2_requests', user: 'borrowbloc_user', accounts: 'borrowbloc_accounts' };

// ─── Date helpers ──────────────────────────────────────────────────────────
const localISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => localISO(new Date());
const shiftISO = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return localISO(d); };
const addDays = n => shiftISO(todayISO(), n);
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const fmtDate = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
const fmtDay = iso => new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const ago = iso => { const d = daysBetween(iso, todayISO()); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d}d ago`; };

// Rough per-item estimates for the impact numbers: retail price ($), manufacturing
// footprint (kg CO2e) and weight (kg). Each loan counts as one purchase avoided.
const CATEGORY_META = {
  'Power Tools':        { icon: 'drill',    value: 120, co2: 30, kg: 2,  color: 'bg-sky-100 text-sky-600' },
  'Gardening':          { icon: 'sprout',   value: 80,  co2: 40, kg: 12, color: 'bg-lime-100 text-lime-600' },
  'Yard & Maintenance': { icon: 'wrench',   value: 150, co2: 60, kg: 10, color: 'bg-violet-100 text-violet-600' },
  'Kitchen':            { icon: 'chef-hat', value: 60,  co2: 45, kg: 6,  color: 'bg-rose-100 text-rose-600' },
  'Camping':            { icon: 'tent',     value: 100, co2: 25, kg: 4,  color: 'bg-orange-100 text-orange-600' },
};
const DEFAULT_META = { icon: 'package', value: 50, co2: 20, kg: 3, color: 'bg-slate-100 text-slate-600' };
const meta = c => CATEGORY_META[c] || DEFAULT_META;

// Demo accounts: no passwords, just pick a neighbor. 555-01xx numbers are reserved as fictional.
const DEMO_ACCOUNTS = [
  { name: 'Sarah Jenkins',     home: '#14 Maple St', phone: '+15555550101' },
  { name: 'Marcus Lee',        home: '#22 Maple St', phone: '+15555550102' },
  { name: 'Priya Patel',       home: '#9 Oak Ave',   phone: '+15555550103' },
  { name: 'Alex Kim',          home: '#31 Oak Ave',  phone: '+15555550104' },
  { name: 'Ria Nimbkar',       home: '#5 Birch Ln',  phone: '+15555550105' },
  { name: 'Ruthu Shankar',     home: '#18 Birch Ln', phone: '+15555550106' },
  { name: 'Maninder Kaur',     home: '#27 Maple St', phone: '+15555550107' },
  { name: 'Sooryashankar Joy', home: '#40 Oak Ave',  phone: '+15555550108' },
];
const AVATAR_COLORS = ['bg-emerald-500', 'bg-sky-500', 'bg-violet-500', 'bg-amber-500', 'bg-rose-500', 'bg-teal-500', 'bg-indigo-500', 'bg-fuchsia-500'];

// Sample photos from Wikimedia Commons; most licenses require showing the credit.
const PHOTO_CREDITS = {
  "assets/tools/cordless-drill.jpg": { author: "Fructibus", license: "CC0", url: "https://commons.wikimedia.org/wiki/File:Cordless_electric_(screw)_drill.jpg" },
  "assets/tools/ladder.jpg": { author: "Amin", license: "CC BY-SA 4.0", url: "https://commons.wikimedia.org/wiki/File:Ladder_aluminum.jpg" },
  "assets/tools/wheelbarrow.jpg": { author: "Oto Zapletal", license: "CC BY 4.0", url: "https://commons.wikimedia.org/wiki/File:Two_wheelbarrows.jpg" },
  "assets/tools/circular-saw.jpg": { author: "simplicity hunter", license: "CC BY 2.0", url: "https://commons.wikimedia.org/wiki/File:DeWalt_circular_saw_in_use.jpg" },
  "assets/tools/pressure-washer.jpg": { author: "FBenjr123", license: "CC BY-SA 4.0", url: "https://commons.wikimedia.org/wiki/File:Kawasaki_Pressure_Washer_HPW_302.jpg" },
  "assets/tools/hedge-trimmer.jpg": { author: "Simon Speed", license: "CC0", url: "https://commons.wikimedia.org/wiki/File:BnDHedgeTrimmerExtended.JPG" },
  "assets/tools/stand-mixer.jpg": { author: "Your Best Digs", license: "CC BY 2.0", url: "https://commons.wikimedia.org/wiki/File:White_KitchenAid_mixer_(KSM150PSWH).jpg" },
  "assets/tools/tent.jpg": { author: "ModalPeak", license: "CC BY-SA 4.0", url: "https://commons.wikimedia.org/wiki/File:Dome_tent_in_the_BWCA_(CDM11452CT).jpg" },
};

// ─── Sample data (dates are relative to today so the demo never goes stale) ─
function mockTools() {
  const t = (id, name, category, owner, photo, extra = {}) => ({
    id, name, category, owner, photo: `assets/tools/${photo}.jpg`,
    status: 'Available', borrower: '', due: '', waitlist: [], reservations: [], condition: 'Good', conditionNote: '', ...extra,
  });
  return [
    t(1, 'Cordless Drill', 'Power Tools', 'Marcus Lee', 'cordless-drill', {
      reservations: [{ name: 'Sooryashankar Joy', start: addDays(3), end: addDays(4) }] }),
    t(2, 'Heavy-Duty Ladder', 'Yard & Maintenance', 'Priya Patel', 'ladder', {
      status: 'Checked Out', borrower: 'Sarah Jenkins', due: addDays(5), waitlist: ['Alex Kim'] }),
    t(3, 'Wheelbarrow', 'Gardening', 'Alex Kim', 'wheelbarrow'),
    t(4, 'Circular Saw', 'Power Tools', 'Marcus Lee', 'circular-saw', {
      condition: 'Needs attention', conditionNote: 'Blade is getting dull, cuts are slow.' }),
    t(5, 'Pressure Washer', 'Yard & Maintenance', 'Sarah Jenkins', 'pressure-washer', {
      status: 'Checked Out', borrower: 'Marcus Lee', due: addDays(-5), waitlist: ['Priya Patel', 'Alex Kim'] }),
    t(6, 'Hedge Trimmer', 'Gardening', 'Priya Patel', 'hedge-trimmer'),
    t(7, 'Stand Mixer', 'Kitchen', 'Sarah Jenkins', 'stand-mixer', {
      reservations: [{ name: 'Maninder Kaur', start: addDays(0), end: addDays(1) }] }),
    t(8, '4-Person Tent', 'Camping', 'Alex Kim', 'tent', {
      reservations: [{ name: 'Ruthu Shankar', start: addDays(9), end: addDays(12) }] }),
  ];
}

// [tool id, borrower, days ago, days kept (null = still out), condition, note]. Loans are due after 7 days.
const MOCK_LOAN_ROWS = [
  [1, 'Sarah Jenkins', 61, 5, 'Good'], [3, 'Priya Patel', 58, 3, 'Good'], [7, 'Alex Kim', 55, 2, 'Good'],
  [4, 'Priya Patel', 51, 6, 'Good'], [1, 'Alex Kim', 47, 4, 'Good'], [6, 'Marcus Lee', 44, 10, 'Good', 'Sorry it was late!'],
  [8, 'Sarah Jenkins', 40, 6, 'Good'], [3, 'Marcus Lee', 37, 9, 'Needs attention', 'Tyre is a bit flat'],
  [1, 'Priya Patel', 33, 2, 'Good'], [7, 'Ria Nimbkar', 31, 3, 'Good', 'Made 4 dozen cookies, thank you!'],
  [5, 'Alex Kim', 30, 5, 'Good'], [7, 'Priya Patel', 27, 3, 'Good'], [6, 'Sooryashankar Joy', 26, 6, 'Good'],
  [2, 'Marcus Lee', 24, 7, 'Good'], [1, 'Maninder Kaur', 22, 4, 'Good'], [4, 'Sarah Jenkins', 21, 5, 'Good'],
  [6, 'Alex Kim', 18, 7, 'Good'], [3, 'Ruthu Shankar', 17, 2, 'Good'], [1, 'Sarah Jenkins', 16, 3, 'Good'],
  [8, 'Priya Patel', 14, 6, 'Good'], [5, 'Marcus Lee', 12, null], [4, 'Ria Nimbkar', 11, 5, 'Needs attention', 'Blade is getting dull, cuts are slow.'],
  [3, 'Sarah Jenkins', 9, 2, 'Good'], [1, 'Alex Kim', 6, 3, 'Good'], [7, 'Sooryashankar Joy', 4, 2, 'Good'],
  [2, 'Sarah Jenkins', 2, null],
];
function mockLoans() {
  const byId = Object.fromEntries(mockTools().map(t => [t.id, t]));
  return MOCK_LOAN_ROWS.map(([id, borrower, agoDays, kept, condition = '', note = '']) => {
    const t = byId[id], date = addDays(-agoDays);
    return { date, toolId: id, tool: t.name, category: t.category, borrower, owner: t.owner,
      due: shiftISO(date, LOAN_DAYS), returned: kept == null ? '' : shiftISO(date, kept), condition, note };
  });
}

function mockRequests() {
  return [
    { id: 1, tool: 'Tile Saw', note: 'Redoing the bathroom floor this weekend', by: 'Ria Nimbkar', date: addDays(-1), status: 'open' },
    { id: 2, tool: 'Carpet Cleaner', note: 'Puppy + new rug = disaster', by: 'Maninder Kaur', date: addDays(-3), status: 'open' },
    { id: 3, tool: 'Kayak', note: 'Lake trip next month, happy to swap for baked goods!', by: 'Ruthu Shankar', date: addDays(-5), status: 'open' },
    { id: 4, tool: 'Label Maker', note: 'Garage organisation project', by: 'Sooryashankar Joy', date: addDays(-6), status: 'open' },
  ];
}

// localStorage can throw (private mode, blocked storage), so every access is guarded.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ─── State ─────────────────────────────────────────────────────────────────
let tools = [];
let loans = [];
let requests = [];
let query = '';
let activeCategory = 'All';
let mode = SHEET_ENDPOINT ? 'live' : 'demo';
let busy = false;           // pause polling while a write is in flight
let flashId = null;
let user = store.get(KEYS.user, null);
let afterLogin = null;      // action to resume once someone signs in
let tour = null;            // guided tour state; writes are sandboxed while it runs

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safePhoto = p => /^(data:image\/(png|jpe?g|webp|gif);base64,|https:\/\/|assets\/[\w\/.-]+$)/.test(p || '') ? p : '';
const sameName = (a, b) => !!a && !!b && a.trim().toLowerCase() === b.trim().toLowerCase();
const isMe = n => !!user && sameName(n, user.name);
const firstName = n => (n || '').split(' ')[0];
const money = n => '$' + Math.round(n).toLocaleString();
const isOverdue = t => t.status === 'Checked Out' && t.due && t.due < todayISO();
const isBroken = t => t.condition === 'Broken';
const activeRes = t => t.reservations.find(r => r.start <= todayISO() && todayISO() <= r.end);
// Who gets first dibs on an available tool: today's booking, else the head of the waitlist.
const heldFor = t => (t.status !== 'Available' || isBroken(t) ? '' : activeRes(t)?.name || t.waitlist[0] || '');
const nextResFor = (t, name) => t.reservations.filter(r => r.start > todayISO() && !sameName(r.name, name)).sort((a, b) => a.start.localeCompare(b.start))[0];

// ─── Branding ──────────────────────────────────────────────────────────────
// Navbar logo is assets/favico.png, browser-tab icon is assets/image.png;
// either falls back to the hammer if its file is missing.
function setupBranding() {
  const logo = new Image();
  logo.onload = () => { $('logo').className = 'w-9 h-9 shrink-0 rounded-xl overflow-hidden bg-white'; $('logo').innerHTML = '<img src="assets/favico.png" alt="BorrowBloc" class="w-full h-full object-cover" />'; };
  logo.src = 'assets/favico.png';

  const img = new Image();
  img.onerror = () => {
    try {
      const svg = lucide.createElement(lucide.icons.Hammer);
      svg.setAttribute('stroke', '#ffffff');
      svg.setAttribute('width', '20'); svg.setAttribute('height', '20'); svg.setAttribute('x', '6'); svg.setAttribute('y', '6');
      const icon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#059669"/>${new XMLSerializer().serializeToString(svg)}</svg>`;
      $('favicon').type = 'image/svg+xml';
      $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(icon);
    } catch (e) { console.warn('favicon fallback failed', e); }
  };
  img.src = 'assets/image.png';
}

// ─── Accounts ──────────────────────────────────────────────────────────────
function allAccounts() {
  const extra = store.get(KEYS.accounts, []);
  return [...DEMO_ACCOUNTS, ...extra.filter(a => !DEMO_ACCOUNTS.some(d => sameName(d.name, a.name)))];
}
function accountFor(name) { return allAccounts().find(a => sameName(a.name, name)); }
function avatarColor(name) {
  let h = 0; for (const c of name || '') h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) { return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
function avatar(name, size = 'w-8 h-8 text-xs') {
  return `<span class="${size} ${avatarColor(name)} shrink-0 rounded-full grid place-items-center text-white font-semibold">${esc(initials(name))}</span>`;
}

function setUser(account) {
  user = { name: account.name, home: account.home || '' };
  store.set(KEYS.user, user);
  if (!allAccounts().some(a => sameName(a.name, user.name))) store.set(KEYS.accounts, [...store.get(KEYS.accounts, []), user]);
  render();
}
function signIn(account) {
  setUser(account);
  closeModal();
  toast(`Welcome, ${firstName(user.name)}! 👋`);
  const next = afterLogin; afterLogin = null;
  if (next) next();
}
function signOut() {
  user = null; store.del(KEYS.user);
  if (activeCategory === 'Mine') activeCategory = 'All';
  render(); toast('Signed out');
}
function requireUser(next) {
  if (user) return next();
  afterLogin = next;
  openLogin();
}

function openLogin() {
  const accts = allAccounts();
  openModal(`
    <div class="p-6 pb-0 flex items-start justify-between">
      <div><div class="font-semibold text-lg">Sign in to BorrowBloc</div><div class="text-sm text-slate-500">Demo accounts, no password needed.</div></div>
      <button data-close class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-6 grid sm:grid-cols-2 gap-2" id="accountList">
      ${accts.map((a, i) => `
        <button data-acct="${i}" class="w-full flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 text-left">
          ${avatar(a.name, 'w-10 h-10 text-sm')}
          <span class="flex-1 min-w-0"><span class="block font-medium truncate">${esc(a.name)}</span>
          <span class="block text-xs text-slate-500 truncate">${esc(a.home || 'Neighbor')}</span>
          <span class="block mt-1">${trustBadge(a.name)}</span></span>
        </button>`).join('')}
    </div>
    <form id="newAcct" class="px-6 pb-6 pt-2 border-t border-slate-100 space-y-3">
      <div class="text-sm font-medium pt-3">New here? Join your street</div>
      <div class="flex gap-2">
        <input name="name" required maxlength="40" placeholder="Your name" class="flex-1 min-w-0 px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        <input name="home" maxlength="30" placeholder="House #" class="w-28 px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>
      <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl">Join</button>
    </form>`, false, 'max-w-2xl');

// ─── Trust ─────────────────────────────────────────────────────────────────
// A neighbor's track record, computed from the loan history.
function trust(name) {
  const done = loans.filter(l => sameName(l.borrower, name) && l.returned);
  const onTime = done.filter(l => !l.due || l.returned <= l.due).length;
  const lateNow = tools.some(t => isOverdue(t) && sameName(t.borrower, name));
  const broke = done.some(l => l.condition === 'Broken');
  const rate = done.length ? onTime / done.length : 1;
  const level =
    done.length < 2 && !lateNow ? ['New neighbor', 'bg-slate-100 text-slate-600', 'sprout']
    : rate >= 0.9 && !lateNow && !broke ? ['Trusted', 'bg-emerald-100 text-emerald-700', 'shield-check']
    : rate >= 0.6 && !lateNow ? ['Reliable', 'bg-sky-100 text-sky-700', 'thumbs-up']
    : ['Often late', 'bg-amber-100 text-amber-700', 'alarm-clock'];
  return {
    label: level[0], cls: level[1], icon: level[2], done: done.length, rate, lateNow,
    detail: done.length ? `${done.length} returns · ${Math.round(rate * 100)}% on time` : 'No returns yet',
  };
}
function trustBadge(name) {
  if (!name) return '';
  const t = trust(name);
  return `<span class="inline-flex items-center gap-1 text-[11px] font-medium px-1.5 py-0.5 rounded-full ${t.cls}" title="${esc(t.detail)}"><i data-lucide="${t.icon}" class="w-3 h-3"></i>${t.label}</span>`;
}

// ─── Photos ────────────────────────────────────────────────────────────────
// Shrink to a small JPEG so it fits in one sheet cell and in localStorage.
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let size = 480, q = 0.75, out = '';
    for (let k = 0; k < 10; k++) {
      const s = Math.min(1, size / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length <= MAX_PHOTO_CHARS) return out;
      q -= 0.1;
      if (q < 0.45) { q = 0.7; size = Math.round(size * 0.75); }
    }
    throw new Error('Photo too large');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function photoHTML(t, iconSize = 'w-12 h-12') {
  const m = meta(t.category);
  const p = safePhoto(t.photo);
  return p
    ? `<img src="${esc(p)}" alt="${esc(t.name)}" class="w-full h-full object-cover" loading="lazy" />`
    : `<div class="w-full h-full grid place-items-center ${m.color}"><i data-lucide="${m.icon}" class="${iconSize} opacity-80"></i></div>`;
}

// Wires a hidden file input + preview; returns a getter for the chosen photo.
function photoPicker(inputId, previewId, initial = '') {
  let photo = initial;
  $(inputId).onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      photo = await compressImage(file);
      $(previewId).innerHTML = `<img src="${photo}" class="w-full h-full object-cover" />`;
    } catch { toast('Could not use that image, try another', true); }
  };
  return () => photo;
}

// ─── Data layer ────────────────────────────────────────────────────────────
function parseList(v) {
  if (Array.isArray(v)) return v;
  try { const j = JSON.parse(v || '[]'); return Array.isArray(j) ? j : []; } catch { return []; }
}

function normalize(r) {
  const blank = v => (v && v !== '—' ? String(v) : '');
  return {
    id: Number(r.id),
    name: r.name || '',
    category: r.category || 'Other',
    status: r.status === 'Checked Out' ? 'Checked Out' : 'Available',
    borrower: blank(r.borrower),
    due: blank(r.due).slice(0, 10),
    owner: blank(r.owner),
    photo: safePhoto(r.photo),
    waitlist: (Array.isArray(r.waitlist) ? r.waitlist : String(r.waitlist || '').split(','))
      .map(n => String(n).trim()).filter(n => n && n !== '—'),
    reservations: parseList(r.reservations)
      .filter(x => x && x.name && x.start && x.end && x.end >= todayISO())
      .map(x => ({ name: String(x.name), start: String(x.start).slice(0, 10), end: String(x.end).slice(0, 10) }))
      .sort((a, b) => a.start.localeCompare(b.start)),
    condition: ['Needs attention', 'Broken'].includes(r.condition) ? r.condition : 'Good',
    conditionNote: blank(r.conditionNote),
  };
}
const normalizeLoan = l => ({
  date: String(l.date || '').slice(0, 10), toolId: Number(l.toolId), tool: l.tool || '', category: l.category || '',
  borrower: l.borrower || '', owner: l.owner || '', due: String(l.due || '').slice(0, 10),
  returned: String(l.returned || '').slice(0, 10), condition: l.condition || '', note: l.note || '',
});
const normalizeRequest = r => ({
  id: Number(r.id), tool: r.tool || '', note: r.note || '', by: r.by || '', date: String(r.date || '').slice(0, 10),
  status: ['fulfilled', 'closed'].includes(r.status) ? r.status : 'open', fulfilledBy: r.fulfilledBy || '', fulfilledOn: String(r.fulfilledOn || '').slice(0, 10),
});

function loadLocal() {
  tools = (store.get(KEYS.tools, null) || mockTools()).map(normalize);
  loans = (store.get(KEYS.loans, null) || mockLoans()).map(normalizeLoan);
  requests = (store.get(KEYS.requests, null) || mockRequests()).map(normalizeRequest);
}
function saveLocal() {
  const ok = store.set(KEYS.tools, tools) && store.set(KEYS.loans, loans) && store.set(KEYS.requests, requests);
  if (!ok) toast('Browser storage is full, change not saved locally', true);
}

async function fetchAll() {
  if (mode !== 'live' || tour) return;
  try {
    const res = await fetch(SHEET_ENDPOINT, { cache: 'no-store' });
    const data = await res.json();
    if (!Array.isArray(data.tools)) throw new Error('bad payload');
    if (busy || tour) return;
    const before = JSON.stringify([tools, loans, requests]);
    const next = data.tools.map(normalize);
    const nextLoans = (data.loans || []).map(normalizeLoan);
    const nextReqs = (data.requests || []).map(normalizeRequest);
    if (JSON.stringify([next, nextLoans, nextReqs]) !== before) {
      // Highlight whichever card changed remotely (e.g. someone edited the sheet).
      const changed = next.find(n => { const o = tools.find(t => t.id === n.id); return !o || JSON.stringify(o) !== JSON.stringify(n); });
      const first = !tools.length;
      tools = next; loans = nextLoans; requests = nextReqs;
      if (changed && !first) flashId = changed.id;
      render();
    }
    setSync('live');
  } catch (e) {
    console.warn('Sheet fetch failed', e);
    setSync('offline');
  }
}

async function write(action, payload) {
  if (tour) return true;                     // the tour works on a scratch copy
  if (mode !== 'live') { saveLocal(); return true; }
  busy = true;
  try {
    // text/plain avoids a CORS preflight, which Apps Script doesn't answer.
    const res = await fetch(SHEET_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'write failed');
    return true;
  } catch (e) {
    console.warn(e);
    toast(e.message && !/fetch|network/i.test(e.message) ? e.message : 'Could not reach the sheet, change not saved', true);
    return false;
  } finally {
    busy = false;
  }
}

// Apply a change optimistically, persist it, and roll back if the write fails.
async function mutate(apply, action, payload) {
  const snap = JSON.stringify([tools, loans, requests]);
  apply(); render();
  const ok = await write(action, payload);
  if (!ok) { [tools, loans, requests] = JSON.parse(snap); render(); }
  return ok;
}

// ─── Actions ───────────────────────────────────────────────────────────────
const toolById = id => tools.find(t => t.id === id);

async function checkout(id, due) {
  const t = toolById(id);
  flashId = id; closeModal();
  const ok = await mutate(() => {
    Object.assign(t, { status: 'Checked Out', borrower: user.name, due });
    t.waitlist = t.waitlist.filter(n => !isMe(n));
    t.reservations = t.reservations.filter(r => !(isMe(r.name) && r.start <= todayISO()));
    loans.push({ date: todayISO(), toolId: id, tool: t.name, category: t.category, borrower: user.name, owner: t.owner, due, returned: '', condition: '', note: '' });
  }, 'checkout', { id, borrower: user.name, due });
  if (ok) toast(`${t.name} is yours until ${fmtDate(due)}. Enjoy!`);
}

async function giveBack(id, condition, note) {
  const t = toolById(id);
  const returner = t.borrower;
  flashId = id; closeModal();
  const ok = await mutate(() => {
    Object.assign(t, { status: 'Available', borrower: '', due: '', condition, conditionNote: condition === 'Good' ? '' : note });
    const loan = [...loans].reverse().find(l => l.toolId === id && !l.returned);
    if (loan) Object.assign(loan, { returned: todayISO(), condition, note });
  }, 'return', { id, condition, note });
  if (!ok) return;

  // Hand-offs: tell the owner about damage, and the next person that it's back.
  const blocks = [];
  if (condition !== 'Good' && t.owner && !isMe(t.owner)) {
    blocks.push(nudgeHTML(t.owner,
      `Hi ${firstName(t.owner)}, I just returned your ${t.name} on BorrowBloc. Heads up: ${condition === 'Broken' ? "it's broken" : 'it needs a bit of attention'}${note ? ` (${note})` : ''}. Happy to help sort it out!`,
      `Let ${esc(firstName(t.owner))} know`));
  }
  const next = heldFor(t);
  if (next && !isBroken(t)) {
    const home = accountFor(t.owner)?.home;
    blocks.push(nudgeHTML(next,
      `Hi ${firstName(next)}! The ${t.name} is back${t.owner ? ` at ${firstName(t.owner)}'s${home ? ` (${home})` : ''}` : ''} and it's held for you on BorrowBloc. Grab it when you're ready!`,
      `Let ${esc(firstName(next))} know it's back`));
  }
  if (!blocks.length) return toast(`Thanks for returning the ${t.name}!`);
  openModal(`
    <div class="p-6 space-y-4">
      <div class="flex items-start justify-between">
        <div><div class="font-semibold text-lg">Thanks${isMe(returner) ? '' : ' for logging it'}! 🙌</div>
        <div class="text-sm text-slate-500">${next && !isBroken(t) ? `${esc(t.name)} is now held for <b>${esc(next)}</b>.` : `${esc(t.name)} is marked <b>${esc(condition)}</b>.`}</div></div>
        <button data-close class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      ${blocks.join('')}
    </div>`, false);
}

async function markFixed(id) {
  const t = toolById(id);
  if (await mutate(() => Object.assign(t, { condition: 'Good', conditionNote: '' }), 'fixed', { id })) {
    toast(`${t.name} is back in action 🔧`); openTool(id);
  }
}

async function addTool(name, category, photo, requestId) {
  const id = tools.reduce((m, t) => Math.max(m, t.id), 0) + 1;
  const t = normalize({ id, name, category, status: 'Available', owner: user.name, photo });
  flashId = id; closeModal();
  const req = requests.find(r => r.id === requestId);
  const ok = await mutate(() => {
    tools.push(t);
    if (req) Object.assign(req, { status: 'fulfilled', fulfilledBy: user.name, fulfilledOn: todayISO() });
  }, 'add', { ...t, requestId });
  if (!ok) return;
  if (!req) return toast(`${name} added to the library 🎉`);
  openModal(`
    <div class="p-6 space-y-4">
      <div class="flex items-start justify-between">
        <div><div class="font-semibold text-lg">You made ${esc(firstName(req.by))}'s day 🎉</div>
        <div class="text-sm text-slate-500">${esc(name)} is listed and the request is marked found.</div></div>
        <button data-close class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      ${nudgeHTML(req.by, `Hi ${firstName(req.by)}! Saw your BorrowBloc request, I've got a ${name} you can borrow. It's listed now, grab it whenever!`, `Let ${esc(firstName(req.by))} know`)}
    </div>`, false);
}

async function setPhoto(id, photo) {
  const t = toolById(id);
  flashId = id; closeModal();
  if (await mutate(() => { t.photo = photo; }, 'photo', { id, photo })) toast('Photo updated');
}

async function joinWaitlist(id) {
  const t = toolById(id);
  if (t.waitlist.some(isMe)) return;
  const ok = await mutate(() => t.waitlist.push(user.name), 'join', { id, name: user.name });
  openTool(id);
  if (ok) toast(`You're #${t.waitlist.length} in line for the ${t.name}`);
}

async function leaveWaitlist(id, name) {
  const t = toolById(id);
  const ok = await mutate(() => { t.waitlist = t.waitlist.filter(n => !sameName(n, name)); }, 'leave', { id, name });
  openTool(id);
  if (ok) toast(isMe(name) ? 'You left the line' : 'Hold released');
}

function reserveError(t, start, end) {
  if (!start || !end) return 'Pick a start and end date';
  if (start < todayISO()) return "Can't book days in the past";
  if (end < start) return 'End date is before the start';
  if (daysBetween(start, end) >= MAX_BOOKING_DAYS) return `Bookings are ${MAX_BOOKING_DAYS} days max`;
  if (t.status === 'Checked Out' && t.due && start <= t.due) return `It's out until ${fmtDate(t.due)}`;
  const clash = t.reservations.find(r => start <= r.end && r.start <= end);
  if (clash) return `Clashes with ${isMe(clash.name) ? 'your' : firstName(clash.name) + "'s"} booking (${fmtDate(clash.start)}–${fmtDate(clash.end)})`;
  return '';
}

async function reserve(id, start, end) {
  const t = toolById(id);
  const err = reserveError(t, start, end);
  if (err) return toast(err, true);
  const ok = await mutate(() => {
    t.reservations.push({ name: user.name, start, end });
    t.reservations.sort((a, b) => a.start.localeCompare(b.start));
  }, 'reserve', { id, name: user.name, start, end });
  openTool(id);
  if (ok) toast(`Booked ${fmtDate(start)}${end !== start ? `–${fmtDate(end)}` : ''} 📅`);
}

async function unreserve(id, name, start) {
  const t = toolById(id);
  const ok = await mutate(() => { t.reservations = t.reservations.filter(r => !(sameName(r.name, name) && r.start === start)); }, 'unreserve', { id, name, start });
  openTool(id);
  if (ok) toast('Booking cancelled');
}

async function askTool(tool, note) {
  const id = requests.reduce((m, r) => Math.max(m, r.id), 0) + 1;
  closeModal();
  const r = { id, tool, note, by: user.name, date: todayISO(), status: 'open', fulfilledBy: '', fulfilledOn: '' };
  if (await mutate(() => requests.push(r), 'request', r)) {
    toast('Request posted to the street 📣');
    $('requests').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

async function closeRequest(id) {
  const r = requests.find(r => r.id === id);
  if (await mutate(() => { r.status = 'closed'; }, 'closeRequest', { id })) toast('Request closed');
}
